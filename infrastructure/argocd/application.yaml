# Argo CD Application for RAG Chatbot
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-chatbot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/rag-chatbot.git
    targetRevision: HEAD
    path: infrastructure/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: rag-chatbot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
# Argo CD AppProject for isolation
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: rag-chatbot-project
  namespace: argocd
spec:
  description: RAG Chatbot Enterprise Application
  sourceRepos:
  - '*'
  destinations:
  - namespace: rag-chatbot
    server: https://kubernetes.default.svc
  - namespace: istio-system
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
