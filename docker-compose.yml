# Docker Compose for Enterprise RAG Chatbot
# For local development without GPU

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ragchatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Redis 7.2 with RediSearch for VSS
  redis:
    image: redis/redis-stack:7.2.0-v10
    container_name: rag-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-network

  # vLLM Service (REQUIRES GPU - commented out by default)
  # Uncomment if you have NVIDIA GPU with CUDA support
  # See docker-compose.gpu.yml for GPU configuration
  # vllm-service:
  #   image: vllm/vllm-openai:latest
  #   container_name: rag-vllm
  #   environment:
  #     HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
  #   ports:
  #     - "8100:8000"
  #   volumes:
  #     - vllm_cache:/root/.cache/huggingface
  #   command:
  #     - --model
  #     - ${VLLM_MODEL:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
  #     - --dtype
  #     - auto
  #     - --max-model-len
  #     - "2048"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   networks:
  #     - rag-network

  # llama.cpp CPU fallback (REQUIRES MODEL FILE - commented out by default)
  # To use: Download a GGUF model file and place it in the llama_models volume
  # Example: docker run --rm -v llama_models:/models alpine wget -O /models/model.gguf <model-url>
  # llama-cpp:
  #   image: ghcr.io/ggerganov/llama.cpp:server
  #   container_name: rag-llama-cpp
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - llama_models:/models
  #   command:
  #     - -m
  #     - /models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
  #     - --host
  #     - 0.0.0.0
  #     - --port
  #     - "8080"
  #   networks:
  #     - rag-network

  # Prefect Server
  prefect-server:
    image: prefecthq/prefect:2.14-python3.11
    container_name: rag-prefect-server
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "4200:4200"
    depends_on:
      - postgres
    networks:
      - rag-network

  # Grafana Tempo (Tracing)
  tempo:
    image: grafana/tempo:latest
    container_name: rag-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"   # tempo
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
    networks:
      - rag-network

  # Grafana Loki (Logs)
  loki:
    image: grafana/loki:latest
    container_name: rag-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - rag-network

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - tempo
      - loki
    networks:
      - rag-network

  # Apache Flink (for Feast)
  flink-jobmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: rag-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - flink_data:/tmp
    networks:
      - rag-network

  flink-taskmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: rag-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - rag-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragchatbot
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      VLLM_ENDPOINT: http://vllm-service:8000
      LLAMA_CPP_ENDPOINT: http://llama-cpp:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PREFECT_API_URL: http://prefect-server:4200/api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      ENABLE_TRACING: "true"
      USE_VLLM: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - minio
      - prefect-server
      - tempo
      # - llama-cpp  # Uncomment if using llama.cpp
    networks:
      - rag-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: rag-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:8000/graphql
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - rag-network
    command: npm run dev

  # Envoy Proxy (Ingress)
  envoy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: rag-envoy
    ports:
      - "8888:8888"
      - "9901:9901"  # Admin interface
    volumes:
      - ./infrastructure/contour/envoy-config.yaml:/etc/envoy/envoy.yaml
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml
    depends_on:
      - backend
      - frontend
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vllm_cache:
  llama_models:
  tempo_data:
  loki_data:
  grafana_data:
  flink_data:
