# Docker Compose for Enterprise RAG Chatbot
# For local development without GPU

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ragchatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"      # Changed host port to 5433 to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Redis 7.2 with RediSearch for VSS
  redis:
    image: redis/redis-stack:7.2.0-v10
    container_name: rag-redis
    ports:
      - "6380:6379"      # Changed host port to 6380 to avoid conflicts
      - "8002:8001"      # Changed RedisInsight to 8002
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-network

  # vLLM Service (REQUIRES GPU - commented out by default)
  # Uncomment if you have NVIDIA GPU with CUDA support
  # See docker-compose.gpu.yml for GPU configuration
  # vllm-service:
  #   image: vllm/vllm-openai:latest
  #   container_name: rag-vllm
  #   environment:
  #     HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
  #   ports:
  #     - "8100:8000"
  #   volumes:
  #     - vllm_cache:/root/.cache/huggingface
  #   command:
  #     - --model
  #     - ${VLLM_MODEL:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}
  #     - --dtype
  #     - auto
  #     - --max-model-len
  #     - "2048"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   networks:
  #     - rag-network

  # Ollama - Local LLM inference (replaces llama.cpp)
  # Much better WSL2 compatibility and easier model management
  # Using v0.11.0 for stability (v0.12.x has API bugs)
  ollama:
    image: ollama/ollama:0.11.0
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rag-network

  # llama.cpp CPU fallback (DISABLED - replaced by Ollama)
  # Ollama has better WSL2 compatibility
  # llama-cpp:
  #   image: ghcr.io/ggerganov/llama.cpp:server
  #   container_name: rag-llama-cpp
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - llama_models:/models
  #   command:
  #     - -m
  #     - /models/Llama-3.2-3B-Instruct-Q4_K_M.gguf
  #     - --host
  #     - 0.0.0.0
  #     - --port
  #     - "8080"
  #     - -c
  #     - "4096"
  #     - --n-gpu-layers
  #     - "0"
  #   networks:
  #     - rag-network

  # Prefect Server
  prefect-server:
    image: prefecthq/prefect:2.14-python3.11
    container_name: rag-prefect-server
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "4200:4200"
    depends_on:
      - postgres
    networks:
      - rag-network

  # Grafana Tempo (Tracing)
  tempo:
    image: grafana/tempo:latest
    container_name: rag-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"   # tempo
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
    networks:
      - rag-network

  # Grafana Loki (Logs)
  loki:
    image: grafana/loki:latest
    container_name: rag-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - rag-network

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - rag-network
    restart: unless-stopped

  # Promtail (Log Shipper to Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: rag-promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - rag-network
    restart: unless-stopped

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - rag-network

  # Apache Flink (for Feast)
  flink-jobmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: rag-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - flink_data:/tmp
    networks:
      - rag-network

  flink-taskmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: rag-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - rag-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragchatbot
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      VLLM_ENDPOINT: http://vllm-service:8000
      OLLAMA_ENDPOINT: http://ollama:11434
      LLAMA_CPP_ENDPOINT: http://llama-cpp:8080  # Deprecated
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      PREFECT_API_URL: http://prefect-server:4200/api
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4317  # gRPC endpoint (no http://)
      ENABLE_TRACING: ${ENABLE_TRACING:-true}
      USE_VLLM: ${USE_VLLM:-false}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright  # Use base image browsers (chromium-1140)
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - minio
      - prefect-server
      - tempo
      - ollama  # Local LLM with better WSL2 support
    networks:
      - rag-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: rag-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:8000/graphql
      # Disable Next.js cache in development to avoid volume issues
      NEXT_PRIVATE_STANDALONE: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_nextjs_cache:/app/.next
    depends_on:
      - backend
    networks:
      - rag-network
    command: npm run dev

  # Envoy Proxy (Ingress)
  envoy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: rag-envoy
    ports:
      - "8888:8888"
      - "9901:9901"  # Admin interface
    volumes:
      - ./infrastructure/contour/envoy-config.yaml:/etc/envoy/envoy.yaml
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml
    depends_on:
      - backend
      - frontend
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vllm_cache:
  llama_models:
  ollama_models:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  flink_data:
  frontend_nextjs_cache:
