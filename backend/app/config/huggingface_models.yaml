# ============================================================================
# Recommendations by GPU/VRAM
# ============================================================================

recommendations:
  # For small GPUs (<8GB VRAM) - RTX 3060 12GB, GTX 1660 Ti
  small_gpu:
    - "Qwen/Qwen2.5-1.5B-Instruct"
    - "unsloth/qwen2.5-1.5b-instruct-bnb-4bit"

  # For medium GPUs (8-16GB VRAM) - RTX 3080, RTX A4000, RTX 4070
  medium_gpu:
    - "unsloth/qwen2.5-7b-instruct-bnb-4bit"
    - "Qwen/Qwen2.5-7B-Instruct"
    - "unsloth/mistral-7b-instruct-v0.2-bnb-4bit"
    - "mistralai/Mistral-7B-Instruct-v0.2"

  # For large GPUs (>16GB VRAM) - RTX 4090, A5000, A100
  large_gpu:
    - "meta-llama/Llama-2-13b-hf"
    - "mistralai/Mixtral-8x7B-Instruct-v0.1"

  # For fastest training (Unsloth optimized)
  fastest_training:
    - "unsloth/qwen2.5-1.5b-instruct-bnb-4bit"
    - "unsloth/qwen2.5-7b-instruct-bnb-4bit"
    - "unsloth/mistral-7b-instruct-v0.2-bnb-4bit"

  # For best quality (larger models)
  best_quality:
    - "Qwen/Qwen2.5-7B-Instruct"
    - "mistralai/Mistral-7B-Instruct-v0.2"
    - "meta-llama/Llama-2-7b-chat-hf"

# ============================================================================
# Training Method Compatibility
# ============================================================================

training_methods:
  peft_lora:
    description: "Standard LoRA fine-tuning with PEFT"
    compatible_with_all: true
    recommended_for:
      - "Qwen/Qwen2.5-1.5B-Instruct"
      - "Qwen/Qwen2.5-7B-Instruct"
      - "mistralai/Mistral-7B-Instruct-v0.2"

  unsloth:
    description: "Unsloth optimized training (2-5x faster)"
    compatible_models:
      - "unsloth/qwen2.5-1.5b-instruct-bnb-4bit"
      - "unsloth/qwen2.5-7b-instruct-bnb-4bit"
      - "unsloth/mistral-7b-instruct-v0.2-bnb-4bit"
      - "Qwen/Qwen2.5-1.5B-Instruct"  # Can use with standard models too
      - "Qwen/Qwen2.5-7B-Instruct"
      - "mistralai/Mistral-7B-Instruct-v0.2"
    recommended_for:
      - "unsloth/qwen2.5-1.5b-instruct-bnb-4bit"
      - "unsloth/qwen2.5-7b-instruct-bnb-4bit"

  sft:
    description: "Supervised fine-tuning with TRL"
    compatible_with_all: true
    recommended_for:
      - "Qwen/Qwen2.5-7B-Instruct"
      - "mistralai/Mistral-7B-Instruct-v0.2"

