# Promtail Configuration for shipping logs to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only scrape backend container
      - source_labels: ['__meta_docker_container_name']
        regex: '/(rag-backend)'
        action: keep

      # Set job label to 'backend'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'job'
        replacement: 'backend'

      # Add container name label
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
        regex: '/(.*)'

      # Add container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

    pipeline_stages:
      # Extract JSON from audit events
      - json:
          expressions:
            event_type: event_type
            action_type: action_type
            user_id: user_id
            status_code: status_code
            latency_ms: latency_ms

      # Add labels from extracted fields
      - labels:
          event_type:
          action_type:

      # Only keep lines with AUDIT_EVENT
      - match:
          selector: '{job="backend"}'
          stages:
            - regex:
                expression: '.*AUDIT_EVENT.*'
